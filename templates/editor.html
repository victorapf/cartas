{% extends "base.html" %}
{% block title %}Nueva Carta{% endblock %}
{% block content %}
<div class="letter-view">
    <div class="letter-number" style="font-size:28px;">♥ Nueva Carta ♥</div>
    <br>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Título de la carta</label>
            <input type="text" name="title" class="form-control" placeholder="Ej: Hoy pensé en ti..." required>
        </div>

        <div class="form-group">
            <label>Escribe tu carta</label>
            <textarea name="content" class="form-control" placeholder="Escribe aquí tu carta... (o sube un PDF debajo)"></textarea>
        </div>

        <div class="form-group">
            <label>Sube una foto</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>

        <div class="form-group">
            <label>O sube un PDF</label>
            <input type="file" name="pdf" class="form-control" accept=".pdf">
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button type="submit" class="btn btn-green">Guardar Carta</button>
            <a href="{{ url_for('gallery') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
